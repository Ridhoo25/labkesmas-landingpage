# docker-compose-dokploy.yml
# Deploy landing page (nginx + PHP-FPM) ke Dokploy.
# Reverse proxy & SSL otomatis ditangani oleh Traefik (bawaan Dokploy).
#
# Domain: labkesmas.kalteng.go.id
# Backend API: labkesmas-kalteng.id (nginx memproxy /api ke domain ini)
#
# Catatan Dokploy:
#   - certresolver "letsencrypt" adalah default Dokploy (SSL otomatis).
#   - Tidak ada `ports:` karena Traefik yang mengekspos 80/443.
#   - File ini HARUS bernama docker-compose.yml di Dokploy (default search).

services:
  web:
    build: .
    image: labkesmas-landingpage
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.services.web-labkes.loadbalancer.server.port=80
      # --- labkesmas.kalteng.go.id : HTTPS ---
      - traefik.http.routers.labkes-go.rule=Host(`labkesmas.kalteng.go.id`)
      - traefik.http.routers.labkes-go.entrypoints=websecure
      - traefik.http.routers.labkes-go.tls.certResolver=letsencrypt
      - traefik.http.routers.labkes-go.service=web-labkes
      # --- labkesmas.kalteng.go.id : HTTP -> HTTPS ---
      - traefik.http.routers.labkes-go-http.rule=Host(`labkesmas.kalteng.go.id`)
      - traefik.http.routers.labkes-go-http.entrypoints=web
      - traefik.http.routers.labkes-go-http.middlewares=labkes-go-redirect
      - traefik.http.middlewares.labkes-go-redirect.redirectscheme.scheme=https
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
    name: dokploy-network
